services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aniversarios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  app:
    build: .
    depends_on: [db]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aniversarios?schema=public
    ports: ["3000:3000"]
volumes: {postgres_data: {}}
